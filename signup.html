<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signup-form">
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="auth.html">Sign In</a></p>
</div>

<audio id="bg-music" src="Ghostly_music.mp3" loop autoplay></audio>

<script>
const music = document.getElementById("bg-music");
music.volume = 1.0;

document.getElementById("signup-form").addEventListener("submit", async function(e){
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    if(!username || !password) return alert("Enter both username and password!");

    try{
        const resIP = await fetch('https://api.ipify.org?format=json');
        const data = await resIP.json();
        const ip = data.ip;

        const users = JSON.parse(localStorage.getItem("ghostlyUsers") || "{}");
        if(users[username]) return alert("Username already exists!");

        users[username] = { password, approved: false, ip };
        localStorage.setItem("ghostlyUsers", JSON.stringify(users));

        // Send to Node.js server
        await fetch("http://localhost:3000/signup-webhook", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, ip })
        });

        alert("Signup request sent! Waiting for admin approval.");
        this.reset();
    } catch(err){
        alert("Server or IP error: " + err.message);
    }
});
</script>
</body>
</html>
