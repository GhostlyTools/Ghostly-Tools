<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: url('https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.floating-text {
    position: absolute;
    font-size: 2.2rem;
    font-weight: bold;
    color: rgba(255,0,0,0.15);
    pointer-events: none;
    animation: float 12s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity:0; }
    10% { opacity:0.2; }
    50% { transform: translateY(50vh) translateX(100px) rotate(180deg); opacity:0.15; }
    100% { transform: translateY(-20vh) translateX(200px) rotate(360deg); opacity:0; }
}

.login-container {
    background: rgba(0,0,0,0.75);
    border: 3px solid red;
    padding: 45px 35px;
    border-radius: 20px;
    text-align: center;
    width: 350px;
    max-width: 90%;
    animation: heartbeat 1.5s infinite;
    box-shadow: 0 0 20px rgba(255,0,0,0.7);
    position: relative;
    z-index: 10;
}

.login-container h1 {
    color: red;
    margin-bottom: 30px;
    font-size: 30px;
    text-shadow: 1px 1px 4px #000;
}

.login-container input {
    width: 90%;
    padding: 14px;
    margin: 12px 0;
    border: 2px solid red;
    border-radius: 10px;
    background: #111;
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}

.login-container input:focus {
    border-color: #ff5555;
    box-shadow: 0 0 10px red;
}

.login-container button {
    width: 95%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    background: red;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.login-container button:hover {
    background: #fff;
    color: red;
    box-shadow: 0 0 15px red;
}

.login-container p {
    margin-top: 22px;
    font-size: 15px;
}

.login-container p a {
    color: red;
    text-decoration: underline;
    cursor: pointer;
}

@keyframes heartbeat {
    0%, 100% { box-shadow: 0 0 10px red; }
    50% { box-shadow: 0 0 25px red; }
}

@media (max-width: 480px) {
    .login-container { width: 90%; padding: 30px 20px; top:0; margin:auto; box-shadow:0 0 25px rgba(255,0,0,0.7); }
    .login-container h1 { font-size: 24px; margin-bottom: 20px; }
    .login-container input, .login-container button { font-size: 14px; padding: 12px; }
    .floating-text { font-size: 1.6rem; animation-duration: 18s; }
}
</style>
</head>
<body>

<!-- Floating Sign Up texts -->
<div class="floating-text" style="left:10%; animation-delay:0s;">Sign Up</div>
<div class="floating-text" style="left:30%; animation-delay:3s;">Sign Up</div>
<div class="floating-text" style="left:50%; animation-delay:6s;">Sign Up</div>
<div class="floating-text" style="left:70%; animation-delay:1s;">Sign Up</div>
<div class="floating-text" style="left:90%; animation-delay:4s;">Sign Up</div>

<div class="login-container">
  <h1>Ghostly Tools 👻</h1>
  <form id="signup-form">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign Up</button>
  </form>
  <p>Already have an account? <a href="signin.html">Sign In</a></p>
</div>

<script>
const webhookURL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

async function getIP() {
    try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip || "Unknown IP";
    } catch { return "Unknown IP"; }
}

async function sendWebhook(username, ip, userCount) {
    try {
        await fetch(webhookURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                content: `💀 New User Sign Up:\nUsername: ${username}\nIP: ${ip}\nTotal Users: ${userCount}`
            })
        });
    } catch (err) { console.error("Webhook failed:", err); }
}

document.getElementById("signup-form").addEventListener("submit", async function(e){
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    // Prevent admin signup
    if(username === "Ghostly" && password === "Dare2995!") {
        alert("⚠️ Cannot create admin account!");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users") || "[]");
    if(users.some(u => u.username.toLowerCase() === username.toLowerCase())){
        alert("⚠️ Username already exists!");
        return;
    }

    const newUser = { username, password, status: "pending" };
    users.push(newUser);
    localStorage.setItem("users", JSON.stringify(users));

    const ip = await getIP();

    // Send webhook immediately for admin to detect
    await sendWebhook(username, ip, users.length);

    alert("✅ Account created! Waiting for admin approval.");
    window.location.href = "pending.html";
});
</script>

</body>
</html>
