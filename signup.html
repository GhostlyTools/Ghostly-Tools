<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signup-form">
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="auth.html">Sign In</a></p>
</div>

<script>
const webhookURL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

document.getElementById("signup-form").addEventListener("submit", function(e){
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  let users = JSON.parse(localStorage.getItem("users") || "[]");

  // Check if username already exists (case-insensitive)
  if(users.some(u => u.username.toLowerCase() === username.toLowerCase())){
    alert(`Username "${username}" already exists! Please choose another.`);
    return;
  }

  users.push({username,password,status:"pending"});
  localStorage.setItem("users", JSON.stringify(users));

  // Send signup info to Discord webhook
  fetch(webhookURL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({content:`💀 New signup: ${username}`})
  });

  alert("Account created! Waiting for admin approval.");
  window.location.href = "pending.html";
});
</script>
</body>
</html>
