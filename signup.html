<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: url('https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-container {
    background: rgba(17,17,17,0.85);
    border: 3px solid red;
    padding: 40px 30px;
    border-radius: 20px;
    text-align: center;
    width: 340px;
    animation: heartbeat 1.5s infinite;
    box-shadow: 0 0 15px rgba(255,0,0,0.5);
}

.login-container h1 {
    color: red;
    margin-bottom: 25px;
    font-size: 28px;
}

.login-container input {
    width: 90%;
    padding: 12px;
    margin: 12px 0;
    border: 2px solid red;
    border-radius: 8px;
    background: #111;
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: 0.2s;
}

.login-container input:focus {
    border-color: #ff4444;
    box-shadow: 0 0 8px red;
}

.login-container button {
    width: 95%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: red;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

.login-container button:hover {
    background: #fff;
    color: red;
}

.login-container p {
    margin-top: 20px;
    font-size: 14px;
}

.login-container p a {
    color: red;
    text-decoration: underline;
    cursor: pointer;
}

@keyframes heartbeat {
    0%, 100% { box-shadow: 0 0 10px red; }
    50% { box-shadow: 0 0 25px red; }
}
</style>
</head>
<body>

<div class="login-container">
  <h1>Ghostly Tools 👻</h1>
  <form id="signup-form">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign Up</button>
  </form>
  <p>Already have an account? <a href="auth.html">Sign In</a></p>
</div>

<script>
const webhookURL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

async function sendWebhook(message) {
  try {
    await fetch(webhookURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: message })
    });
  } catch (err) {
    console.log("Webhook failed:", err);
  }
}

async function getIP() {
  try {
    const res = await fetch("https://api.ipify.org?format=json");
    const data = await res.json();
    return data.ip;
  } catch { return "Unknown"; }
}

document.getElementById("signup-form").addEventListener("submit", async function(e){
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  let users = JSON.parse(localStorage.getItem("users") || "[]");
  if(users.some(u => u.username.toLowerCase() === username.toLowerCase())){
    alert("⚠️ Username \"" + username + "\" already exists!");
    return;
  }

  const newUser = { username, password, status: "pending" };
  users.push(newUser);
  localStorage.setItem("users", JSON.stringify(users));

  const ip = await getIP();
  await sendWebhook("💀 New user: " + username + "\nIP: " + ip);

  setTimeout(() => {
    alert("✅ Account created! Waiting for admin approval.");
    window.location.href = "pending.html";
  }, 1000);
});
</script>

</body>
</html>
