<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="floating-page-name">Sign Up</div>

<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signup-form">
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="auth.html">Sign In</a></p>
</div>

<script>
const webhookURL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

// Async webhook sender
function sendWebhook(message){
  return fetch(webhookURL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({content: message})
  }).catch(()=>{});
}

// Get IP
async function getIP(){
  try{
    const res = await fetch("https://api.ipify.org?format=json");
    const data = await res.json();
    return data.ip;
  } catch {
    return "Unknown";
  }
}

document.getElementById("signup-form").addEventListener("submit", async function(e){
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  let users = JSON.parse(localStorage.getItem("users") || "[]");

  if(users.some(u => u.username.toLowerCase() === username.toLowerCase())){
    alert(`Username "${username}" already exists!`);
    return;
  }

  const newUser = {username, password, status:"pending"};
  users.push(newUser);
  localStorage.setItem("users", JSON.stringify(users));

  const ip = await getIP();
  await sendWebhook(`💀 New user: ${username}\nIP: ${ip}`);

  setTimeout(()=>{
    alert("✅ Account created! Waiting for admin approval.");
    window.location.href="pending.html";
  },1000);
});
</script>

</body>
</html>
