<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  margin:0; padding:0; font-family:"Creepster", cursive; color:#fff;
  background:url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed;
  background-size:cover;
}
.haunted-box {
  background: rgba(0,0,0,0.7); padding:20px; border-radius:10px;
  text-align:center; margin:50px auto; max-width:400px; box-shadow:0 0 25px red;
}
input, button { width:90%; padding:10px; margin:10px auto; border-radius:5px; border:none; display:block; }
button { background:red; color:#fff; font-weight:bold; cursor:pointer; transition:0.3s; }
button:hover { background:darkred; }
a { color:#f55; text-decoration:none; }
a:hover { text-decoration:underline; }
</style>
</head>
<body>

<div class="haunted-box">
<h1>Ghostly Tools 👻</h1>
<form id="signup-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="auth.html">Sign In</a></p>
</div>

<script>
const webhookURL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

document.getElementById("signup-form").addEventListener("submit", async function(e){
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  // Store locally for demo purposes
  localStorage.setItem("username", username);
  localStorage.setItem("password", password);
  localStorage.setItem("status", "pending"); // new user pending

  // Send to Discord webhook
  fetch(webhookURL, {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({content:`🆕 New signup: ${username}, Status: Pending`})
  });

  alert("Signup successful! Awaiting admin approval.");
  window.location.href = "auth.html";
});
</script>

</body>
</html>
