<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signup-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="auth.html">Sign In</a></p>
</div>

<audio id="bg-music" src="Ghostly_music.mp3" loop></audio>

<script>
const music=document.getElementById("bg-music");
music.volume=1.0;
function playMusic(){music.play().catch(()=>{});}
playMusic();
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e, playMusic, {once:true}));

const webhookURL="https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

document.getElementById("signup-form").addEventListener("submit", function(e){
  e.preventDefault();
  const username=document.getElementById("username").value;
  const password=document.getElementById("password").value;

  fetch('https://api.ipify.org?format=json')
    .then(res=>res.json())
    .then(data=>{
      const ip=data.ip;
      const users=JSON.parse(localStorage.getItem("ghostlyUsers")||"{}");
      if(users[username]) return alert("Username already exists!");
      users[username]={password,password,approved:false,ip:ip};
      localStorage.setItem("ghostlyUsers",JSON.stringify(users));

      fetch(webhookURL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({content:`👻 New signup request:\nUsername: ${username}\nIP: ${ip}\nStatus: Pending approval`})
      }).then(()=>alert("Signup request sent. Waiting for admin approval."))
        .catch(err=>alert("Webhook error: "+err));
    })
    .catch(err=>alert("IP fetch error: "+err));
});
</script>
</body>
</html>
