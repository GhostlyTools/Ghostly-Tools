<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="bgMusic" src="https://youtu.be/a07qXFXjEDI?si=iKaU17u6krCtEizg" autoplay loop></audio>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signup-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="auth.html">Sign In</a></p>
<div id="music-controls">
<button onclick="playMusic()">▶️ Play</button>
<button onclick="pauseMusic()">⏸️ Pause</button>
<button onclick="rewindMusic()">⏮️ Rewind</button>
<button onclick="forwardMusic()">⏭️ Forward</button>
</div>
</div>

<script>
const music = document.getElementById("bgMusic");
function playMusic(){ music.play(); }
function pauseMusic(){ music.pause(); }
function rewindMusic(){ music.currentTime = 0; }
function forwardMusic(){ music.currentTime += 10; }

document.getElementById("signup-form").addEventListener("submit", function(e){
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  let users = JSON.parse(localStorage.getItem("users") || "[]");
  if(users.find(u=>u.username===username)){
    alert("Username taken");
    return;
  }
  users.push({username,password,status:"pending"});
  localStorage.setItem("users", JSON.stringify(users));
  alert("Account created! Waiting for admin approval.");
  window.location.href = "pending.html";
});
</script>
</body>
</html>
