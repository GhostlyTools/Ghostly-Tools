<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<link rel="stylesheet" href="style.css">
<style>
body {margin:0;padding:0;height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;
font-family:"Creepster", cursive,sans-serif;color:#fff;
background:url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed;background-size:cover;}
.login-container {background:rgba(0,0,0,0.7);padding:30px;border-radius:10px;box-shadow:0 0 20px red;text-align:center;animation:flicker 2s infinite;}
h1 {margin-bottom:20px;text-shadow:0 0 10px red,0 0 20px black;}
input {display:block;width:100%;margin:10px 0;padding:10px;border:none;border-radius:5px;}
button {background:red;color:white;border:none;padding:10px;width:100%;cursor:pointer;border-radius:5px;font-weight:bold;transition:0.3s;}
button:hover {background:darkred;}
a {color:#f55;text-decoration:none;}
a:hover {text-decoration:underline;}
@keyframes flicker {0%,19%,21%,23%,25%,54%,56%,100%{box-shadow:0 0 20px red;}20%,24%,55%{box-shadow:none;}}
</style>
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signup-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="auth.html">Sign In</a></p>
</div>

<audio id="bg-music" src="Ghostly_music.mp3" loop></audio>

<script>
const music=document.getElementById("bg-music");
music.volume=1.0;
music.play().catch(()=>{const playMusic=()=>{music.play(); alert("👻 Welcome to Ghostly Tools — the alternate toolbox!"); document.removeEventListener("click",playMusic); document.removeEventListener("keydown",playMusic); document.removeEventListener("touchstart",playMusic);}
document.addEventListener("click",playMusic); document.addEventListener("keydown",playMusic); document.addEventListener("touchstart",playMusic);});

const webhookURL="https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

document.getElementById("signup-form").addEventListener("submit", function(e){
  e.preventDefault();
  const username=document.getElementById("username").value;
  const password=document.getElementById("password").value;

  fetch('https://api.ipify.org?format=json')
    .then(res=>res.json())
    .then(data=>{
      const ip=data.ip;
      const users=JSON.parse(localStorage.getItem("ghostlyUsers")||"{}");
      if(users[username]) return alert("Username already exists!");
      users[username]={password,password,approved:false,ip:ip};
      localStorage.setItem("ghostlyUsers",JSON.stringify(users));

      fetch(webhookURL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({content:`👻 New signup request:\nUsername: ${username}\nIP: ${ip}\nStatus: Pending approval`})
      }).then(()=>alert("Signup request sent. Waiting for admin approval."))
        .catch(err=>alert("Webhook error: "+err));
    })
    .catch(err=>alert("IP fetch error: "+err));
});
</script>
</body>
</html>
