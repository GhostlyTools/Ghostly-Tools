<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<link rel="stylesheet" href="style.css">
<style>
/* Body and overlay */
body {margin:0; padding:0; font-family:"Creepster",cursive; color:#fff; background:url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed; background-size:cover; display:flex; justify-content:center; align-items:center; height:100vh; position:relative;}
body::before {content:""; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:0;}

/* Login container */
.login-container {position:relative; z-index:1; background:rgba(0,0,0,0.85); padding:30px; border-radius:15px; text-align:center; width:300px; box-shadow:0 0 25px red; animation:heartbeatGlow 1.5s ease-in-out infinite, flicker 0.2s infinite;}
.login-container h1,.login-container p,.login-container a,.login-container button {color:#ff0000; font-weight:bold; text-shadow:0 0 5px #ff0000,0 0 10px #ff0000,0 0 15px #880000,0 0 20px #550000; animation:drip 1.5s infinite;}
.login-container input {width:100%; padding:10px; margin:10px 0; border:none; border-radius:5px; background:#222; color:#fff; outline:none;}
.login-container button {width:100%; padding:10px; border:none; border-radius:5px; cursor:pointer; background:red; color:#fff;}
.login-container button:hover {background:#ff0000cc;}
.login-container a:hover {text-decoration:underline;}

/* Floating title */
.floating-title {position:fixed; top:20px; left:50%; transform:translateX(-50%); font-family:"Creepster",cursive; font-size:2rem; color:#ff0000; text-shadow:0 0 5px #ff0000,0 0 10px #ff0000,0 0 15px #880000,0 0 20px #550000; animation:drip 1.5s infinite, heartbeatGlow 2s ease-in-out infinite; z-index:1000; pointer-events:none;}

/* Animations */
@keyframes heartbeatGlow {0%,100%{box-shadow:0 0 15px red;}25%{box-shadow:0 0 50px red;}50%{box-shadow:0 0 20px red;}75%{box-shadow:0 0 40px red;}}
@keyframes flicker {0%,100%{opacity:1;}50%{opacity:0.95;}}
@keyframes drip {0%,100%{text-shadow:0 0 5px #ff0000,0 0 10px #ff0000,0 0 15px #880000,0 0 20px #550000;}50%{text-shadow:0 5px 10px #ff0000,0 10px 15px #ff0000,0 15px 20px #880000,0 20px 25px #550000;}}
</style>
</head>
<body>
  <div class="floating-title">Sign Up</div>
  <div class="login-container">
    <h1>Ghostly Tools 👻</h1>
    <form id="signup-form">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="auth.html">Sign In</a></p>
  </div>

<script>
const webhookURL="https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";
function sendWebhook(message){return fetch(webhookURL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:message})}).catch(()=>{});}
async function getIP(){try{const res=await fetch("https://api.ipify.org?format=json"); const data=await res.json(); return data.ip;}catch{return"Unknown";}}
document.getElementById("signup-form").addEventListener("submit",async function(e){
  e.preventDefault();
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;
  let users=JSON.parse(localStorage.getItem("users")||"[]");
  if(users.some(u=>u.username.toLowerCase()===username.toLowerCase())){alert(`Username "${username}" already exists!`); return;}
  const newUser={username,password,status:"pending"};
  users.push(newUser);
  localStorage.setItem("users",JSON.stringify(users));
  const ip=await getIP();
  await sendWebhook(`💀 New user: ${username}\nIP: ${ip}`);
  setTimeout(()=>{alert("✅ Account created! Waiting for admin approval."); window.location.href="pending.html";},1000);
});
</script>
</body>
</html>
