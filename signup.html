<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghostly Tools 👻 - Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="haunted-box">
<h1>Ghostly Tools 👻</h1>
<form id="signup-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="auth.html">Sign In</a></p>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

function sendWebhook(message){
  fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:message})});
}

document.getElementById("signup-form").addEventListener("submit",function(e){
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  let users = JSON.parse(localStorage.getItem("users")||"[]");
  if(users.find(u=>u.username===username)){
    alert("Username already exists!");
    return;
  }
  const user = { username, password, status:"pending" };
  users.push(user);
  localStorage.setItem("users",JSON.stringify(users));
  sendWebhook(`New signup: ${username}`);
  alert("Signup successful! Waiting for admin approval.");
  window.location.href="auth.html";
});
</script>
</body>
</html>
