<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
body {margin:0;padding:0;font-family:"Creepster", cursive;color:#fff;background:url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed;background-size:cover;}
#downloads-container {padding:20px;text-align:center;background:rgba(0,0,0,0.6);margin:50px auto;border-radius:10px;width:90%;max-width:500px;box-shadow:0 0 20px red;}
#downloads-container h2 {text-shadow:0 0 10px red;}
#downloads-container a {display:block;color:#f55;margin:10px 0;text-decoration:none;}
#downloads-container a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="downloads-container">
<h2>Downloads</h2>
<div id="downloads-content"></div>
</div>

<script>
const urlParams=new URLSearchParams(window.location.search);
const pending=urlParams.get('pending');
const downloadsContent=document.getElementById("downloads-content");

if(pending){
    downloadsContent.innerHTML="<p>Waiting for admin to approve downloads 👻</p>";
}else{
    downloadsContent.innerHTML=`
    <ul>
      <li><a href="https://www.mediafire.com/folder/ywxqi9zw78mnf/ghostly_toolkit" target="_blank">Ghostly Toolkit</a></li>
      <li><a href="https://www.mediafire.com/folder/42ybdsm9ye5zm/Pinger" target="_blank">Pingers</a></li>
      <li><a href="https://www.mediafire.com/file/i19nvh86lnflpfy/savages_Multi_Tool_v2.bat/file" target="_blank">Savage Multitool</a></li>
    </ul>`;
}
</script>
</body>
</html>
