<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>
const user = sessionStorage.getItem('loggedInUser');
if(!user){ window.location.href='auth.html'; }
let users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');

if(localStorage.getItem('kick_' + user) === 'true'){
    localStorage.removeItem('kick_' + user);
    sessionStorage.removeItem('loggedInUser');
    alert("You have been kicked by the admin.");
    window.location.href='auth.html';
}
</script>

<img id="logo" src="images/logo.png" alt="Ghostly Logo">

<div class="content">
  <h1>Ghostly Tools 👻</h1>
  <p>Welcome, <span id="user-name"></span></p>
</div>

<div class="downloads" id="downloads">
  <h2>Downloads</h2>
  <ul>
    <li><a href="https://www.mediafire.com/file/i19nvh86lnflpfy/savages_Multi_Tool_v2.bat/file" target="_blank">Savage MultiTool</a></li>
    <li><a href="https://www.mediafire.com/folder/ywxqi9zw78mnf/ghostly_toolkit" target="_blank">Ghostly Toolkit</a></li>
    <li><a href="https://www.mediafire.com/folder/42ybdsm9ye5zm/Pinger" target="_blank">Pinger</a></li>
  </ul>
</div>

<a href="#" id="logout">Logout</a>

<div id="popup" class="popup">
  <div class="popup-content">
    <p id="popup-message">Welcome to Ghostly Tools – The Ultimate Toolbox</p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<audio id="bg-music" src="ghostly_music.mp3" loop autoplay></audio>

<script src="scripts.js"></script>
<script>
document.getElementById('user-name').innerText = user;
users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');

const downloads = document.getElementById('downloads');
if(!users[user] || !users[user].approved){
    downloads.style.display = 'none';
    showPopup("Waiting for admin approval. Downloads are locked.");
}

document.getElementById('logout').addEventListener('click', ()=>{
    sessionStorage.removeItem('loggedInUser');
    window.location.href='auth.html';
});

// Music auto-play
const music = document.getElementById('bg-music');
music.volume = 0.2;
window.addEventListener('load', () => {
    music.play().catch(() => {
        document.body.addEventListener('click', () => { music.play(); }, { once: true });
    });
});

// Kick live check
setInterval(()=>{
    if(localStorage.getItem('kick_' + user) === 'true'){
        localStorage.removeItem('kick_' + user);
        sessionStorage.removeItem('loggedInUser');
        alert("You have been kicked by the admin.");
        window.location.href='auth.html';
    }
}, 2000);

// Initial welcome pop-up
window.addEventListener('load', ()=>{
    showPopup("Welcome to Ghostly Tools – The Ultimate Toolbox");
});
</script>
</body>
</html>
