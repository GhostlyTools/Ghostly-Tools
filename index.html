<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>
  // Redirect if not signed in
  const user = sessionStorage.getItem('loggedInUser');
  if(!user){ window.location.href='auth.html'; }

  const users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');
  const approved = users[user] && users[user].approved;
</script>

<div class="content">
  <h1>Ghostly Tools 👻</h1>
  <p>Welcome, <span id="user-name"></span></p>
</div>

<!-- Downloads Section -->
<div class="downloads" style="display:none;">
  <h2>Downloads</h2>
  <ul>
    <li><a href="https://www.mediafire.com/file/i19nvh86lnflpfy/savages_multi_tool_v2.bat/file" target="_blank">Savage MultiTool</a></li>
    <li><a href="https://www.mediafire.com/folder/ywxqi9zw78mnf/ghostly_toolkit" target="_blank">Ghostly Toolkit</a></li>
    <li><a href="https://www.mediafire.com/folder/42ybdsm9ye5zm/pinger" target="_blank">Pinger</a></li>
  </ul>
</div>

<a href="#" id="logout">Logout</a>

<div id="popup" class="popup">
  <div class="popup-content">
    <p id="popup-message">Welcome to Ghostly Tools – The Ultimate Toolbox</p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<audio id="bg-music" src="ghostly_music.mp3" loop></audio>

<script src="scripts.js"></script>
<script>
document.getElementById('user-name').innerText = user;

// Show downloads only if approved
if(approved) document.querySelector('.downloads').style.display='block';
else showPopup("Waiting for admin approval. Downloads are locked.");

// Logout functionality
document.getElementById('logout').addEventListener('click', ()=>{
    sessionStorage.removeItem('loggedInUser');
    window.location.href='auth.html';
});

// Play background music on all browsers
const music = document.getElementById('bg-music');
music.volume = 0.2;
music.play().catch(()=>{
    document.body.addEventListener('click', ()=>music.play(), { once: true });
    document.body.addEventListener('touchstart', ()=>music.play(), { once: true });
});
</script>
</body>
</html>
