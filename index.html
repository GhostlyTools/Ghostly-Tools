<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title></title>
<link rel="stylesheet" href="style.css">
<style>
/* Downloads box styling */
#downloads-container {
  background: rgba(0,0,0,0.85);
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  width: 400px;
  margin: 50px auto;
  box-shadow: 0 0 25px red;
}

#downloads-container h2 {
  margin-bottom: 20px;
  text-shadow: 0 0 15px red;
}

/* Links styling */
#downloads-content a {
  display: block;
  padding: 10px 15px;
  margin: 10px 0;
  background: rgba(255,0,0,0.8);
  color: white !important;
  text-decoration: none;
  border-radius: 5px;
  font-size: 1.2rem;
  transition: all 0.3s ease;
}

#downloads-content a:hover {
  background: red;
  box-shadow: 0 0 15px red;
}
</style>
</head>
<body>

<div id="downloads-container">
  <h2>Downloads</h2>
  <div id="downloads-content"></div>
</div>

<script>
const signedInUser = localStorage.getItem("signedInUser");
let users = JSON.parse(localStorage.getItem("users") || "[]");
let currentUser = users.find(u => u.username === signedInUser);

const downloadsContent = document.getElementById("downloads-content");

if (!currentUser || currentUser.status !== "approved") {
  downloadsContent.innerHTML = "<p>Downloads 👻 (Pending admin approval)</p>";
} else {
  downloadsContent.innerHTML = `
      <a href="https://www.mediafire.com/folder/ywxqi9zw78mnf/ghostly_toolkit" target="_blank" rel="noopener noreferrer">Ghostly Toolkit</a>
      <a href="https://www.mediafire.com/folder/42ybdsm9ye5zm/Pinger" target="_blank" rel="noopener noreferrer">Pingers</a>
      <a href="https://www.mediafire.com/file/i19nvh86lnflpfy/savages_Multi_Tool_v2.bat/file" target="_blank" rel="noopener noreferrer">Savage Multitool</a>
      <a href="https://www.mediafire.com/folder/133z6qltkuybu/Iplookup" target="_blank" rel="noopener noreferrer">IP Lookup</a>
      <a href="https://www.mediafire.com/folder/esdp7v36ghng1/v3" target="_blank" rel="noopener noreferrer">DDoS v3</a>
  `;
}

// YouTube video removed
</script>

</body>
</html>
