<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title></title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="downloads-container">
  <h2>Downloads</h2>
  <div id="downloads-content"></div>
</div>

<script>
const signedInUser = localStorage.getItem("signedInUser");
let users = JSON.parse(localStorage.getItem("users") || "[]");
let currentUser = users.find(u => u.username === signedInUser);

const downloadsContent = document.getElementById("downloads-content");

if (!currentUser || currentUser.status !== "approved") {
  downloadsContent.innerHTML = "<p>Downloads 👻 (Pending admin approval)</p>";
} else {
  // Use proper HTML escaping and attributes
  downloadsContent.innerHTML = `
    <ul style="list-style:none; padding:0; font-size:1.3rem; line-height:2;">
      <li><a href="https://www.mediafire.com/folder/ywxqi9zw78mnf/ghostly_toolkit" target="_blank" rel="noopener noreferrer" style="color:red; text-decoration:none;">Ghostly Toolkit</a></li>
      <li><a href="https://www.mediafire.com/folder/42ybdsm9ye5zm/Pinger" target="_blank" rel="noopener noreferrer" style="color:red; text-decoration:none;">Pingers</a></li>
      <li><a href="https://www.mediafire.com/file/i19nvh86lnflpfy/savages_Multi_Tool_v2.bat/file" target="_blank" rel="noopener noreferrer" style="color:red; text-decoration:none;">Savage Multitool</a></li>
      <li><a href="https://www.mediafire.com/folder/133z6qltkuybu/Iplookup" target="_blank" rel="noopener noreferrer" style="color:red; text-decoration:none;">IP Lookup</a></li>
      <li><a href="https://www.mediafire.com/folder/esdp7v36ghng1/v3" target="_blank" rel="noopener noreferrer" style="color:red; text-decoration:none;">DDoS v3</a></li>
    </ul>
  `;
}

// YouTube video removed
</script>

</body>
</html>
