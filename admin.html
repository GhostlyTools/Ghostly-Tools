<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghostly Tools — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-haunt">

<script>
const user = sessionStorage.getItem('loggedInUser');
if(!user) location.replace('auth.html');
</script>

<div class="overlay"></div>

<main class="card">
  <h1 class="title">Ghostly Tools 👻</h1>
  <p class="subtitle">Welcome, <span id="user-name"></span></p>

  <section id="downloads" hidden>
    <h2>Downloads</h2>
    <ul>
      <li><a target="_blank" href="https://www.mediafire.com/file/i19nvh86lnflpfy/savages_Multi_Tool_v2.bat/file">Savage MultiTool</a></li>
      <li><a target="_blank" href="https://www.mediafire.com/folder/ywxqi9zw78mnf/ghostly_toolkit">Ghostly Toolkit</a></li>
      <li><a target="_blank" href="https://www.mediafire.com/folder/42ybdsm9ye5zm/Pinger">Pinger</a></li>
    </ul>
  </section>

  <div id="awaiting" class="notice" hidden>
    Waiting for admin approval. Downloads are locked.
  </div>

  <button id="logout" class="btn">Log Out</button>
</main>

<!-- Popup & jumpscare -->
<div id="popup" class="popup" hidden></div>
<div id="jump-scare" class="jump-scare" hidden></div>
<audio id="bg-music" src="Ghostly_music.mp3" loop></audio>
<script src="scripts.js"></script>
<script>
document.getElementById('user-name').textContent = user;

const users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');
if(users[user] && users[user].approved){
  document.getElementById('downloads').hidden = false;
} else {
  document.getElementById('awaiting').hidden = false;
}
</script>
</body>
</html>
