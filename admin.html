<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghostly Admin Panel 👻</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>👻 Ghostly Admin Panel</h1>
<button onclick="toggleWebsite()">Disable/Enable Website</button>
<div id="users"></div>

<script>
async function loadUsers(){
  const res = await fetch("/users");
  const users = await res.json();
  const container = document.getElementById("users");
  container.innerHTML = "";
  users.forEach(u=>{
    const div = document.createElement("div");
    div.className="user-dropdown"+(u.status==="pending"?" pending":"");
    div.innerHTML=`<h3>${u.username}${u.status==="pending"?'<span class="pending-label"> (Pending)</span>':''}</h3>
      <div class="user-dropdown-content">
        <p>Status: ${u.status}</p>
        <p>IP: ${u.ip}</p>
        <p>Area: ${u.area}</p>
        <button onclick="approveUser('${u.username}')">✅ Approve</button>
        <button onclick="denyUser('${u.username}')">❌ Deny</button>
        <button onclick="kickUser('${u.username}')">💥 Kick</button>
      </div>`;
    div.querySelector("h3").onclick=()=>div.querySelector(".user-dropdown-content").classList.toggle("open");
    container.appendChild(div);
  });
}

async function approveUser(u){ await fetch("/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u})}); loadUsers(); }
async function denyUser(u){ await fetch("/deny",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u})}); loadUsers(); }
async function kickUser(u){ await fetch("/kick",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u})}); loadUsers(); }
async function toggleWebsite(){ await fetch("/toggle",{method:"POST"}); alert("Toggled website status"); }

loadUsers();
setInterval(loadUsers,5000);
</script>
</body>
</html>
