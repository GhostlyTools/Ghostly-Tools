<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="admin-container">
<h1>👻 Ghostly Admin Panel</h1>
<button id="disableToggle">Disable Website</button>
<div id="users"></div>

<div class="music-controls">
<button onclick="playMusic()">▶️ Play</button>
<button onclick="pauseMusic()">⏸ Pause</button>
<button onclick="rewindMusic()">⏪ Rewind</button>
<button onclick="forwardMusic()">⏩ Forward</button>
<button onclick="resumeMusic()">▶ Resume</button>
</div>
<div id="music-lines">🎵 Haunted vibes...</div>
<audio id="bg-music" src="music.mp3" loop></audio>
</div>

<script>
const webhookURL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";
let users = JSON.parse(localStorage.getItem("users") || "[]");
let websiteDisabled = false;

function sendWebhook(message){
  fetch(webhookURL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({content: message})
  });
}

// Render users with pending feature
function renderUsers(){
  const container = document.getElementById("users");
  container.innerHTML = "";
  users.forEach(u => {
    const dropdown = document.createElement("div");
    dropdown.className = "user-dropdown";
    if(u.status === "pending") dropdown.classList.add("pending");

    const h3 = document.createElement("h3");
    h3.textContent = u.username;
    if(u.status==="pending"){
      const label = document.createElement("span");
      label.textContent=" (Pending)";
      label.className="pending-label";
      h3.appendChild(label);
    }

    const content = document.createElement("div");
    content.className = "user-dropdown-content";
    content.innerHTML = `
      <p>Status: ${u.status}</p>
      <p>IP: ${u.ip || "Unknown"}</p>
      <p>Area: ${u.area || "Unknown"}</p>
      <button onclick="approveUser('${u.username}')">✅ Approve</button>
      <button onclick="denyUser('${u.username}')">❌ Deny</button>
      <button onclick="kickUser('${u.username}')">💀 Kick</button>
    `;

    h3.onclick = ()=>content.classList.toggle("open");
    dropdown.appendChild(h3);
    dropdown.appendChild(content);
    container.appendChild(dropdown);
  });
}

// Admin actions
function approveUser(username){
  const user = users.find(u=>u.username===username);
  if(user){
    user.status = "approved";
    localStorage.setItem("users", JSON.stringify(users));
    sendWebhook(`✅ ${username} approved by admin`);
    renderUsers();
  }
}
function denyUser(username){
  const user = users.find(u=>u.username===username);
  if(user){
    user.status = "denied";
    localStorage.setItem("users", JSON.stringify(users));
    sendWebhook(`❌ ${username} denied by admin`);
    renderUsers();
  }
}
function kickUser(username){
  users = users.filter(u=>u.username!==username);
  localStorage.setItem("users", JSON.stringify(users));
  sendWebhook(`💀 ${username} kicked by admin`);
  renderUsers();
}

// Toggle website
document.getElementById("disableToggle").onclick = ()=>{
  websiteDisabled = !websiteDisabled;
  if(websiteDisabled){
    alert("Website disabled for updates");
    sendWebhook("⚠️ Website disabled by admin");
  } else {
    alert("Website enabled");
    sendWebhook("✅ Website re-enabled");
  }
}

// Initial render
renderUsers();

// Music controls
const music = document.getElementById("bg-music");
function playMusic(){ music.play(); }
function pauseMusic(){ music.pause(); }
function rewindMusic(){ music.currentTime = 0; }
function forwardMusic(){ music.currentTime += 10; }
function resumeMusic(){ music.play(); }

// Lines sync demo
setInterval(()=>{document.getElementById("music-lines").textContent="🎵 Haunted vibes...";},500);
</script>
</body>
</html>
