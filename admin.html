<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👻 Ghostly Admin Panel</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Creepster", cursive, sans-serif;
  color: #fff;
  background: url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed;
  background-size: cover;
}

.admin-container {
  background: rgba(0,0,0,0.7);
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  margin: 20px auto;
  max-width: 800px;
  box-shadow: 0 0 25px red;
}

.user-dropdown {
  background: rgba(0,0,0,0.8);
  border: 2px solid red;
  border-radius: 10px;
  margin: 10px auto;
  max-width: 700px;
  cursor: pointer;
  box-shadow: 0 0 15px red;
  transition: all 0.3s;
}

.user-dropdown.pending { border: 2px dashed red; animation: pendingFlicker 1.5s infinite; }

.user-dropdown h3 {
  margin: 10px;
  text-shadow: 0 0 10px red;
}

.user-dropdown-content {
  display: none;
  background: rgba(0,0,0,0.9);
  padding: 10px;
  border-top: 1px solid red;
  text-align: center;
  animation: hauntedFlicker 1.5s infinite;
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.5s ease, padding 0.5s ease;
}

.user-dropdown-content.open { display: block; max-height: 200px; padding: 10px; }

.user-dropdown-content p { margin: 5px 0; font-size: 0.9em; }

.user-dropdown-content button { margin: 5px 3px; width: 80px; font-weight: bold; }

.pending-label { color: red; font-weight: bold; margin-left: 10px; animation: pulseRed 1.2s infinite; }

button.disable-site {
  background: darkred;
  width: 200px;
  margin: 10px auto;
  display: block;
}

@keyframes hauntedFlicker { 0%,19%,21%,23%,25%,54%,56%,100% { box-shadow: 0 0 15px red; } 20%,24%,55% { box-shadow: 0 0 5px darkred; } }
@keyframes pendingFlicker { 0%,50%,100% { box-shadow: 0 0 10px red; } 25%,75% { box-shadow: 0 0 20px darkred; } }
@keyframes pulseRed { 0%,100% { opacity: 1; text-shadow:0 0 5px red;} 50% { opacity:0.6; text-shadow:0 0 20px darkred;} }
</style>
</head>
<body>
<div class="admin-container">
<h1>👻 Ghostly Admin Panel</h1>
<button class="disable-site" onclick="disableWebsite()">⚠ Disable Website for Updates</button>
<div id="users"></div>
</div>

<script>
// Load users from server (fetch from backend)
async function loadUsers(){
  const res = await fetch("/users");
  const users = await res.json();
  const container = document.getElementById("users");
  container.innerHTML = "";

  users.forEach(user=>{
    const dropdown = document.createElement("div");
    dropdown.className="user-dropdown";
    if(user.status==="pending") dropdown.classList.add("pending");

    const header = document.createElement("h3");
    header.textContent = user.username;
    if(user.status==="pending"){
      const label = document.createElement("span");
      label.textContent=" (Pending)";
      label.className="pending-label";
      header.appendChild(label);
    }
    header.onclick = ()=>content.classList.toggle("open");

    const content = document.createElement("div");
    content.className="user-dropdown-content";
    content.innerHTML = `
      <p>Status: ${user.status}</p>
      <p>IP: ${user.ip}</p>
      <p>Area: ${user.location}</p>
      <button onclick="approveUser('${user.username}')">✅ Approve</button>
      <button onclick="denyUser('${user.username}')">❌ Deny</button>
      <button onclick="kickUser('${user.username}')">🦶 Kick</button>
    `;

    dropdown.appendChild(header);
    dropdown.appendChild(content);
    container.appendChild(dropdown);
  });
}

async function approveUser(username){
  await fetch("/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})});
  loadUsers();
}

async function denyUser(username){
  await fetch("/deny",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})});
  loadUsers();
}

async function kickUser(username){
  await fetch("/kick",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})});
  loadUsers();
}

async function disableWebsite(){
  await fetch("/disable",{method:"POST"});
  alert("Website is now disabled for updates!");
}

loadUsers();
setInterval(loadUsers,5000);
</script>
</body>
</html>
