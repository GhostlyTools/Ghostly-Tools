<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>
const admin = sessionStorage.getItem('loggedInUser');
if(admin!=="Ghostly"){ window.location.href='auth.html'; }
</script>

<div class="content">
  <h1>Ghostly Admin Panel 👻</h1>
  <h2>Manage Users</h2>
  <ul id="user-list"></ul>
</div>

<a href="#" id="logout">Logout</a>
<div id="popup" class="popup">
  <div class="popup-content">
    <p id="popup-message"></p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<audio id="bg-music" src="ghostly_music.mp3" loop></audio>
<script src="scripts.js"></script>
<script>
const users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');
const userList = document.getElementById('user-list');
Object.keys(users).forEach(u=>{
    const li = document.createElement('li');
    li.innerHTML = `${u} - Approved: ${users[u].approved} 
    <button onclick="approveUser('${u}')">Approve</button>
    <button onclick="kickUser('${u}')">Kick</button>`;
    userList.appendChild(li);
});

function approveUser(username){
    users[username].approved = true;
    localStorage.setItem('ghostlyUsers', JSON.stringify(users));
    showPopup(username + " approved!");
    location.reload();
}

function kickUser(username){
    localStorage.setItem('kick_'+username,true);
    showPopup(username + " will be kicked on next login.");
}

document.getElementById('logout').addEventListener('click', ()=>{
    sessionStorage.removeItem('loggedInUser');
    window.location.href='auth.html';
});

const music = document.getElementById('bg-music');
music.play().then(()=>{ music.volume=1.0; }).catch(e=>console.log(e));
</script>
</body>
</html>
