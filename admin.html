<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools Admin 👻</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    font-family: "Creepster", cursive, sans-serif;
    background: url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    margin: 0;
    padding: 0;
  }

  header {
    text-align: center;
    padding: 20px;
    background: rgba(0,0,0,0.6);
    box-shadow: 0 0 15px red;
  }

  h1 {
    margin: 0;
    text-shadow: 0 0 10px red, 0 0 20px black;
  }

  .user-list-container {
    max-width: 800px;
    margin: 20px auto;
    background: rgba(0,0,0,0.6);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 20px red;
    overflow-y: auto;
    max-height: 500px;
  }

  .user-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.05);
    padding: 10px 15px;
    border-radius: 8px;
    margin-bottom: 10px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .user-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 10px red;
  }

  .user-info {
    font-size: 1.1rem;
  }

  .user-buttons button {
    margin-left: 10px;
    background: red;
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }

  .user-buttons button:hover {
    background: darkred;
  }

  ul {
    list-style: none;
    padding: 0;
  }

</style>
</head>
<body>

<header>
  <h1>Ghostly Tools Admin Panel 👻</h1>
</header>

<div class="user-list-container">
  <ul id="user-list">
    <!-- Pending users will appear here -->
  </ul>
</div>

<script>
const currentUser = sessionStorage.getItem("loggedInUser");
if(currentUser !== "Ghostly") {
  alert("Access denied");
  window.location.href = "auth.html";
}

const pendingList = document.getElementById("user-list");
const users = JSON.parse(localStorage.getItem("ghostlyUsers") || "{}");

// Render users
function renderPendingUsers() {
  pendingList.innerHTML = "";

  Object.keys(users).forEach(username => {
    if(!users[username].approved) {
      const li = document.createElement("li");
      li.classList.add("user-card");

      const info = document.createElement("div");
      info.classList.add("user-info");
      info.textContent = ${username} (IP: ${users[username].ip || "Unknown"});

      const buttons = document.createElement("div");
      buttons.classList.add("user-buttons");

      const allowBtn = document.createElement("button");
      allowBtn.textContent = "Allow Access";
      allowBtn.addEventListener("click", () => {
        users[username].approved = true;
        localStorage.setItem("ghostlyUsers", JSON.stringify(users));
        renderPendingUsers();
      });

      const denyBtn = document.createElement("button");
      denyBtn.textContent = "Deny Access";
      denyBtn.addEventListener("click", () => {
        delete users[username];
        localStorage.setItem("ghostlyUsers", JSON.stringify(users));
        renderPendingUsers();
      });

      buttons.appendChild(allowBtn);
      buttons.appendChild(denyBtn);

      li.appendChild(info);
      li.appendChild(buttons);

      pendingList.appendChild(li);
    }
  });

  if(pendingList.children.length === 0) {
    pendingList.innerHTML = "<li style='text-align:center; padding:20px;'>No pending users</li>";
  }
}

renderPendingUsers();
</script>

</body>
</html>
