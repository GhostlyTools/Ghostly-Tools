<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghostly Tools 👻 - Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>👻 Ghostly Admin Panel</h1>
<button id="disableBtn">Disable Website for Updates</button>
<div id="users"></div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";
function sendWebhook(message){ fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:message})}); }

function getUsers(){ return JSON.parse(localStorage.getItem("users")||"[]"); }
function saveUsers(users){ localStorage.setItem("users",JSON.stringify(users)); }

function loadUsers(){
  const container = document.getElementById("users");
  container.innerHTML="";
  const users = getUsers();
  users.forEach(user=>{
    const div = document.createElement("div");
    div.className="user-dropdown";
    if(user.status==="pending") div.classList.add("pending");
    div.innerHTML = `<h3>${user.username}${user.status==="pending"?'<span class="pending-label"> Pending</span>':''}</h3>
      <div class="user-dropdown-content">
        <p>Status: ${user.status}</p>
        <p>IP: ${user.ip||"Unknown"}, Area: ${user.area||"Unknown"}</p>
        <button onclick="approveUser('${user.username}')">✅ Approve</button>
        <button onclick="denyUser('${user.username}')">❌ Deny</button>
        <button onclick="kickUser('${user.username}')">🛑 Kick</button>
      </div>`;
    div.querySelector("h3").onclick=()=>div.querySelector(".user-dropdown-content").classList.toggle("open");
    container.appendChild(div);
  });
}

function approveUser(username){
  let users = getUsers();
  let user = users.find(u=>u.username===username);
  if(user){ user.status="approved"; saveUsers(users); sendWebhook(`User ${username} approved`); loadUsers(); }
}
function denyUser(username){
  let users = getUsers();
  users = users.filter(u=>u.username!==username);
  saveUsers(users); sendWebhook(`User ${username} denied`); loadUsers();
}
function kickUser(username){
  alert(`${username} has been kicked from the site.`);
  sendWebhook(`User ${username} kicked`);
}

document.getElementById("disableBtn").onclick=function(){
  localStorage.setItem("siteDisabled","true");
  alert("Website disabled for updates. Users will see site down message
