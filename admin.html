<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Admin Panel</title>
<link rel="stylesheet" href="style.css">
<style>
body {margin:0;padding:0;font-family:"Creepster", cursive;color:#fff;background:url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed;background-size:cover;}
.container {padding:20px;text-align:center;background:rgba(0,0,0,0.7);margin:50px auto;border-radius:10px;width:90%;max-width:700px;box-shadow:0 0 20px red;}
h1 {text-shadow:0 0 10px red;margin-bottom:20px;}
button {margin:5px;padding:10px;border:none;border-radius:5px;background:red;color:#fff;font-weight:bold;cursor:pointer;}
button:hover {background:darkred;}
table {width:100%;border-collapse:collapse;}
th,td {padding:10px;border:1px solid #f55;color:#fff;}
th {background:rgba(255,0,0,0.3);}
</style>
</head>
<body>
<div class="container">
<h1>Admin Panel 👻</h1>
<table>
<thead>
<tr><th>Username</th><th>Approved</th><th>IP</th><th>Actions</th></tr>
</thead>
<tbody id="users-list"></tbody>
</table>
</div>

<script>
const webhookURL="https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";
const usersList=document.getElementById("users-list");

function renderUsers(){
    const users=JSON.parse(localStorage.getItem("ghostlyUsers")||"{}");
    usersList.innerHTML="";
    for(let username in users){
        const user=users[username];
        const tr=document.createElement("tr");
        tr.innerHTML=`<td>${username}</td>
        <td>${user.approved}</td>
        <td>${user.ip||"N/A"}</td>
        <td>
          <button onclick="approveUser('${username}')">Approve</button>
          <button onclick="denyUser('${username}')">Deny</button>
        </td>`;
        usersList.appendChild(tr);
    }
}

function approveUser(username){
    const users=JSON.parse(localStorage.getItem("ghostlyUsers")||"{}");
    users[username].approved=true;
    localStorage.setItem("ghostlyUsers",JSON.stringify(users));
    fetch(webhookURL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({content:`✅ User approved: ${username}\nIP: ${users[username].ip||"N/A"}`})
    });
    renderUsers();
}

function denyUser(username){
    const users=JSON.parse(localStorage.getItem("ghostlyUsers")||"{}");
    const ip=users[username].ip||"N/A";
    delete users[username];
    localStorage.setItem("ghostlyUsers",JSON.stringify(users));
    fetch(webhookURL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({content:`❌ User denied: ${username}\nIP: ${ip}`})
    });
    renderUsers();
}

renderUsers();
</script>
</body>
</html>
