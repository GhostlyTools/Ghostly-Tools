<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghostly Tools 👻 - Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>👻 Ghostly Admin Panel</h1>
<div id="users"></div>

<script>
async function loadUsers(){
  const res = await fetch("/users");
  const users = await res.json();
  const container = document.getElementById("users");
  container.innerHTML = "";

  users.forEach(user=>{
    const dropdown = document.createElement("div");
    dropdown.className="dropdown";
    const header = document.createElement("div");
    header.className="dropdown-header";
    header.textContent=user.username;
    if(user.status==="pending"){
      const label = document.createElement("span");
      label.textContent=" (Pending)";
      label.className="pending-label";
      header.appendChild(label);
    }
    header.onclick=()=>dropdown.classList.toggle("active");

    const content=document.createElement("div");
    content.className="dropdown-content";
    content.innerHTML=`<p>Status: ${user.status}</p><p>IP: ${user.ip}</p>
      <button onclick="approveUser('${user.username}')">✅ Approve</button>
      <button onclick="denyUser('${user.username}')">❌ Deny</button>`;

    dropdown.appendChild(header);
    dropdown.appendChild(content);
    container.appendChild(dropdown);
  });
}

async function approveUser(username){
  await fetch("/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})});
  loadUsers();
}

async function denyUser(username){
  await fetch("/deny",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})});
  loadUsers();
}

loadUsers();
setInterval(loadUsers,5000);
</script>
</body>
</html>
