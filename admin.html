<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="content">
  <h1>Ghostly Admin Panel 👻</h1>
  <div id="user-management">
    <h2>Pending Users</h2>
    <ul id="pending-users"></ul>
  </div>
</div>

<div id="popup" class="popup">
  <div class="popup-content">
    <p id="popup-message"></p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<audio id="bg-music" src="ghostly_music.mp3" loop></audio>

<script src="scripts.js"></script>
<script>
let users=JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');
function loadPendingUsers(){const pending=Object.keys(users).filter(u=>!users[u].approved); const ul=document.getElementById('pending-users'); ul.innerHTML=""; pending.forEach(u=>{const li=document.createElement('li'); li.innerHTML=`${u} <button onclick="approveUser('${u}')">Approve</button> <button onclick="kickUser('${u}')">Kick</button>`; ul.appendChild(li);});}
function approveUser(username){users[username].approved=true; localStorage.setItem('ghostlyUsers',JSON.stringify(users)); loadPendingUsers(); showPopup(${username} approved.);}
function kickUser(username){localStorage.setItem('kick_'+username,'true'); delete users[username]; localStorage.setItem('ghostlyUsers',JSON.stringify(users)); loadPendingUsers(); showPopup(${username} kicked.);}
loadPendingUsers();
const music=document.getElementById('bg-music'); music.volume=0.2; music.play().catch(()=>{document.body.addEventListener('click',()=>music.play(),{once:true}); document.body.addEventListener('touchstart',()=>music.play(),{once:true});});
</script>
</body>
</html>
