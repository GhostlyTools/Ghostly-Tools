<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghostly Tools — Admin Panel</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  margin: 0; padding: 0;
  font-family: "Creepster", cursive, sans-serif;
  background: url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #fff;
}

main {
  max-width: 800px;
  margin: 50px auto;
  background: rgba(0,0,0,0.8);
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 0 20px red;
}

h1 {
  text-align: center;
  font-size: 2.5rem;
  margin-bottom: 30px;
  text-shadow: 0 0 10px red, 0 0 20px black;
}

#user-list {
  list-style: none;
  padding: 0;
  margin-bottom: 30px;
}

#user-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.05);
  padding: 12px 15px;
  margin: 8px 0;
  border-radius: 6px;
  transition: background 0.3s;
}

#user-list li:hover {
  background: rgba(255,255,255,0.1);
}

button {
  padding: 8px 12px;
  margin-left: 5px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

button.primary { background: red; color: white; }
button.primary:hover { background: darkred; }

button.secondary { background: #555; color: white; }
button.secondary:hover { background: #777; }

#approve-all { display: block; margin: 0 auto 20px auto; }
#logout { display: block; margin: 20px auto 0 auto; background: #333; color: #fff; }
</style>
<script>
if(sessionStorage.getItem('loggedInUser')!=='Ghostly') location.replace('auth.html');
</script>
</head>
<body>

<main>
  <h1>Admin Panel 👑</h1>
  <button id="approve-all" class="primary">Approve All Users</button>
  <ul id="user-list"></ul>
  <button id="logout">Log Out</button>
</main>

<!-- Background Music -->
<audio id="bg-music" src="Ghostly_music.mp3" loop></audio>

<script src="scripts.js"></script>
<script>
function renderUserList(){
  const list=document.getElementById('user-list');
  const users=JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');
  list.innerHTML='';
  Object.keys(users).forEach(u=>{
    if(u==='Ghostly') return;
    const li=document.createElement('li');
    li.textContent=`${u} — ${users[u].approved?'✅ Approved':'❌ Not approved'}`;
    
    const approveBtn=document.createElement('button'); 
    approveBtn.textContent='Approve'; 
    approveBtn.className='primary';
    approveBtn.onclick=()=>{
      users[u].approved=true;
      localStorage.setItem('ghostlyUsers',JSON.stringify(users));
      renderUserList();
    };

    const kickBtn=document.createElement('button'); 
    kickBtn.textContent='Kick'; 
    kickBtn.className='secondary';
    kickBtn.onclick=()=>{
      users[u].kicked=true;
      localStorage.setItem('ghostlyUsers',JSON.stringify(users));
      renderUserList();
    };

    const btnContainer=document.createElement('span');
    btnContainer.appendChild(approveBtn);
    btnContainer.appendChild(kickBtn);

    li.appendChild(btnContainer);
    list.appendChild(li);
  });
}

renderUserList();

document.getElementById('approve-all').onclick=()=>{
  const users=JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');
  Object.keys(users).forEach(u=>{if(u!=='Ghostly') users[u].approved=true;});
  localStorage.setItem('ghostlyUsers',JSON.stringify(users));
  renderUserList();
};

document.getElementById('logout').onclick=()=>{
  sessionStorage.removeItem('loggedInUser');
  location.replace('auth.html');
};

// Background music at max volume
const music=document.getElementById("bg-music");
music.volume=1.0;
music.play().catch(()=>{
  const playMusic=()=>{
    music.volume=1.0;
    music.play().catch(()=>{});
    window.removeEventListener('pointerdown',playMusic);
    window.removeEventListener('keydown',playMusic);
  };
  window.addEventListener('pointerdown',playMusic);
  window.addEventListener('keydown',playMusic);
});
</script>

</body>
</html>
