<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghostly Tools 👻 - Pending Approval</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  margin:0; padding:0; font-family:"Creepster", cursive; color:#fff;
  height:100vh; display:flex; justify-content:center; align-items:center;
  background:url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed;
  background-size:cover; overflow:hidden;
}

/* Bigger and Readable Pending Box */
.pending-box {
  background:rgba(0,0,0,0.9); 
  padding:60px 50px; 
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 50px red;
  border:3px solid red;
  width:520px; max-width:90%;
  position:relative; z-index:2;
}

/* Heading style - glowing heartbeat */
.pending-box h1 {
  font-size:3rem;
  color:#ff4d4d;
  text-shadow:0 0 25px red, 0 0 40px darkred;
  margin-bottom:20px;
  animation:heartbeatText 2s infinite;
}

/* Paragraph style - readable with subtle glow */
.pending-box p {
  font-size:1.3rem;
  line-height:1.8;
  color:#fff;
  text-shadow:0 0 5px #ff0000aa;
  margin-bottom:25px;
}

/* Strong emphasis for IG contact */
.pending-box p strong {
  color:#ff3333;
  text-shadow:0 0 10px red;
  font-weight:bold;
}

/* Link style - glowing button effect */
.pending-box a {
  display:inline-block;
  padding:10px 25px;
  font-size:1.3rem;
  color:#ff4d4d;
  font-weight:bold;
  text-decoration:none;
  border:2px solid #ff4d4d;
  border-radius:10px;
  box-shadow:0 0 15px red;
  transition:0.3s;
}
.pending-box a:hover {
  box-shadow:0 0 30px red, 0 0 50px darkred;
  text-shadow:0 0 20px red;
}

/* Pulse animation for heading */
@keyframes heartbeatText {
  0%, 100% { text-shadow:0 0 25px red, 0 0 40px darkred; }
  50% { text-shadow:0 0 45px red, 0 0 60px darkred; }
}

/* Floating ghosts and "Waiting..." text */
.floating {
  position:absolute; font-size:2rem; color:rgba(255,0,0,0.7);
  animation:float 12s linear infinite; pointer-events:none;
  z-index:1;
}
.waiting {
  position:absolute; font-size:2.5rem; color:rgba(255,0,0,0.8);
  font-weight:bold; animation:float 15s linear infinite;
  z-index:1;
}
@keyframes float {
  0% {transform:translateY(100vh) translateX(0) rotate(0deg);opacity:0;}
  10% {opacity:1;}
  50% {transform:translateY(50vh) translateX(100px) rotate(180deg);opacity:0.7;}
  100% {transform:translateY(-20vh) translateX(200px) rotate(360deg);opacity:0;}
}
</style>
</head>
<body>

<div class="pending-box">
  <h1>⏳ Pending Approval</h1>
  <p>Your account is awaiting admin approval.<br>
  If not approved within 24 hours, contact: <strong>@weedboysavage420 on IG</strong></p>
  <a href="auth.html">Return to Sign In</a>
</div>

<!-- Floating ghosts -->
<div class="floating" style="left:10%; animation-delay:0s;">👻</div>
<div class="floating" style="left:30%; animation-delay:2s;">👻</div>
<div class="floating" style="left:50%; animation-delay:4s;">👻</div>
<div class="floating" style="left:70%; animation-delay:1s;">👻</div>
<div class="floating" style="left:90%; animation-delay:3s;">👻</div>

<!-- Floating "Waiting..." text -->
<div class="waiting" style="left:15%; animation-delay:1s;">Waiting…</div>
<div class="waiting" style="left:40%; animation-delay:3s;">Waiting…</div>
<div class="waiting" style="left:65%; animation-delay:2s;">Waiting…</div>
<div class="waiting" style="left:85%; animation-delay:4s;">Waiting…</div>

</body>
</html>
