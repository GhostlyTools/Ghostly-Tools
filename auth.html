<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="bgMusic" src="https://www.youtube.com/watch?v=a07qXFXjEDI" autoplay loop></audio>

<!-- Music Controls -->
<div id="musicBar">
  <button onclick="rewindMusic()" class="music-btn">⏮️</button>
  <button onclick="playMusic()" class="music-btn">▶️</button>
  <button onclick="pauseMusic()" class="music-btn">⏸️</button>
  <button onclick="forwardMusic()" class="music-btn">⏭️</button>
  <button onclick="resumeMusic()" class="music-btn">⏯️</button>
  <div id="progressContainer"><div id="progressBar"></div></div>
</div>

<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="login-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
const bgMusic = document.getElementById("bgMusic");
const progressBar = document.getElementById("progressBar");
bgMusic.ontimeupdate = ()=> { if(bgMusic.duration) progressBar.style.width = (bgMusic.currentTime/bgMusic.duration*100)+"%"; }
function playMusic(){bgMusic.play();} function pauseMusic(){bgMusic.pause();}
function resumeMusic(){bgMusic.play();} function forwardMusic(){bgMusic.currentTime+=10;}
function rewindMusic(){bgMusic.currentTime-=10;}

document.getElementById("login-form").addEventListener("submit", function(e){
  e.preventDefault();
  const username=document.getElementById("username").value;
  const password=document.getElementById("password").value;
  let users=JSON.parse(localStorage.getItem("users")||"[]");
  const user=users.find(u=>u.username===username && u.password===password);
  if(user && user.status==="approved"){
    localStorage.setItem("signedInUser",username);
    window.location="index.html";
  } else if(user && user.status==="pending") {
    window.location="pending.html";
  } else { alert("Invalid credentials"); }
});
</script>
</body>
</html>
