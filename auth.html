<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="content">
  <h1>Ghostly Login 👻</h1>

  <!-- Sign In -->
  <div class="auth-form">
    <h2>Sign In</h2>
    <input type="text" id="signin-username" placeholder="Username">
    <input type="password" id="signin-password" placeholder="Password">
    <button id="signin-btn">Sign In</button>
  </div>

  <!-- Sign Up -->
  <div class="auth-form">
    <h2>Sign Up</h2>
    <input type="text" id="signup-username" placeholder="Username">
    <input type="password" id="signup-password" placeholder="Password">
    <button id="signup-btn">Sign Up</button>
  </div>
</div>

<div id="popup" class="popup">
  <div class="popup-content">
    <p id="popup-message"></p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<audio id="bg-music" src="ghostly_music.mp3" loop></audio>

<script src="scripts.js"></script>
<script>
const webhookURL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

// ---------- Sign In ----------
document.getElementById('signin-btn').addEventListener('click', ()=>{
    const username = document.getElementById('signin-username').value.trim();
    const password = document.getElementById('signin-password').value;
    const users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');

    // Admin check
    if(username === "Ghostly" && password === "Dare2995!"){
        sessionStorage.setItem('loggedInUser', username);
        window.location.href = 'admin.html';
        return;
    }

    // Normal user sign-in
    if(users[username] && users[username].password === password){
        sessionStorage.setItem('loggedInUser', username);
        window.location.href = 'index.html';
    } else {
        showPopup("Incorrect username or password.");
    }
});

// ---------- Sign Up ----------
document.getElementById('signup-btn').addEventListener('click', ()=>{
    const username = document.getElementById('signup-username').value.trim();
    const password = document.getElementById('signup-password').value;
    let users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');

    if(users[username]){
        showPopup("Username already exists.");
        return;
    }

    // Save user as not approved
    users[username] = { password: password, approved: false };
    localStorage.setItem('ghostlyUsers', JSON.stringify(users));

    // Send Discord webhook
    fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: New Ghostly user signup: **${username}** })
    });

    showPopup("Sign-up successful! Waiting for admin approval.");
});

// ---------- Background Music Auto-Play ----------
const music = document.getElementById('bg-music');
music.volume = 0.2;
music.play().catch(()=>{
    document.body.addEventListener('click', ()=>music.play(), { once: true });
    document.body.addEventListener('touchstart', ()=>music.play(), { once: true });
});
</script>
</body>
</html>
