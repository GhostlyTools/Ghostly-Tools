<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signin-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
document.getElementById("signin-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const username=document.getElementById("username").value;
  const password=document.getElementById("password").value;

  const res=await fetch("/signin",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username,password})
  });
  const data=await res.json();

  // Send to webhook
  fetch("https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({content:`User Sign In: ${username} IP: ${data.ip} Location: ${data.area}`})
  });

  if(data.status==="pending"){ window.location="pending.html"; }
  else if(data.status==="approved"){ window.location="index.html"; }
  else alert(data.message);
});
</script>
</body>
</html>
