<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="haunted-box">
<h1>Ghostly Tools 👻</h1>
<form id="signin-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
const ADMIN = { username:"Ghostly", password:"Dare2995!" };
const WEBHOOK_URL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

function sendWebhook(message){
  fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:message})});
}

function getUsers(){ return JSON.parse(localStorage.getItem("users")||"[]"); }

document.getElementById("signin-form").addEventListener("submit",function(e){
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  if(username===ADMIN.username && password===ADMIN.password){
    sendWebhook(`Admin ${username} signed in`);
    alert(`🎉 Welcome Admin ${username}!`);
    window.location.href="admin.html";
    return;
  }

  const users = getUsers();
  const user = users.find(u=>u.username===username && u.password===password);
  if(!user){ alert("Invalid username or password!"); return; }

  sendWebhook(`User ${username} signed in. Status: ${user.status}`);

  if(user.status!=="approved"){ localStorage.setItem("pendingUser",username); window.location.href="pending.html"; return; }

  alert(`🎉 Welcome ${username}!`);
  localStorage.setItem("signedInUser",username);
  window.location.href="index.html";
});
</script>
</body>
</html>
