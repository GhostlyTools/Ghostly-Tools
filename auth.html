<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signin-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
document.getElementById("signin-form").addEventListener("submit", function(e){
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  let users = JSON.parse(localStorage.getItem("users") || "[]");
  const user = users.find(u=>u.username===username && u.password===password);
  if(!user){
    alert("Invalid credentials");
    return;
  }
  if(user.status==="pending"){
    window.location.href="pending.html";
    return;
  }
  localStorage.setItem("signedInUser", username);
  window.location.href="index.html";
});
</script>

<!-- YouTube video at the bottom -->
<div style="text-align:center; margin-top:20px;">
  <iframe src="https://www.youtube.com/embed/a07qXFXjEDI?autoplay=1&loop=1&playlist=a07qXFXjEDI"
    frameborder="0" allow="autoplay; encrypted-media" allowfullscreen
    style="width:80%; height:450px; border-radius:10px;">
  </iframe>
</div>

</body>
</html>
