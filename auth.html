<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="bgMusic" autoplay loop></audio>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signin-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>

<div class="music-controls">
<button onclick="playMusic()">▶️</button>
<button onclick="pauseMusic()">⏸️</button>
<button onclick="rewindMusic()">⏪</button>
<button onclick="forwardMusic()">⏩</button>
</div>
</div>

<script>
const music = document.getElementById('bgMusic');
music.src = "https://www.youtube.com/watch?v=a07qXFXjEDI";

function playMusic(){ music.play(); }
function pauseMusic(){ music.pause(); }
function rewindMusic(){ music.currentTime = Math.max(0, music.currentTime-10); }
function forwardMusic(){ music.currentTime += 10; }

const users = JSON.parse(localStorage.getItem('users')||"[]");

document.getElementById("signin-form").addEventListener("submit", function(e){
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const user = users.find(u=>u.username===username && u.password===password);

    if(!user){
        alert("Invalid credentials");
        return;
    }
    localStorage.setItem("signedInUser", username);

    if(user.status==="pending"){
        window.location.href="pending.html";
    } else {
        window.location.href="index.html";
    }
});
</script>
</body>
</html>
