<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign In</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: url('https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-container {
    background: rgba(0,0,0,0.75);
    border: 3px solid red;
    padding: 45px 35px;
    border-radius: 20px;
    text-align: center;
    width: 350px;
    max-width: 90%;
    animation: heartbeat 1.5s infinite;
    box-shadow: 0 0 20px rgba(255,0,0,0.7);
}

.login-container h1 {
    color: red;
    margin-bottom: 30px;
    font-size: 30px;
    text-shadow: 1px 1px 4px #000;
}

.login-container input {
    width: 90%;
    padding: 14px;
    margin: 12px 0;
    border: 2px solid red;
    border-radius: 10px;
    background: #111;
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}

.login-container input:focus {
    border-color: #ff5555;
    box-shadow: 0 0 10px red;
}

.login-container button {
    width: 95%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    background: red;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.login-container button:hover {
    background: #fff;
    color: red;
    box-shadow: 0 0 15px red;
}

.login-container p {
    margin-top: 22px;
    font-size: 15px;
}

.login-container p a {
    color: red;
    text-decoration: underline;
    cursor: pointer;
}

@keyframes heartbeat {
    0%, 100% { box-shadow: 0 0 10px red; }
    50% { box-shadow: 0 0 25px red; }
}

@media (max-width: 400px) {
    .login-container {
        width: 90%;
        padding: 30px 20px;
    }
    .login-container h1 {
        font-size: 24px;
    }
    .login-container button, .login-container input {
        font-size: 15px;
    }
}
</style>
</head>
<body>

<div class="login-container">
  <h1>Ghostly Tools 👻</h1>
  <form id="signin-form">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
  <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
const webhookURL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

async function getIP() {
    try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip;
    } catch {
        return "Unknown IP";
    }
}

async function sendWebhook(username, ip, userCount) {
    try {
        await fetch(webhookURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                content: `💀 User Sign In:\nUsername: ${username}\nIP: ${ip}\nTotal Users: ${userCount}`
            })
        });
    } catch (err) {
        console.log("Webhook failed:", err);
    }
}

document.getElementById("signin-form").addEventListener("submit", async function(e){
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    // Admin login (no autofill)
    if(username === "Ghostly" && password === "Dare2995!"){
        alert("✅ Admin login successful!");
        window.location.href = "admin.html"; // Admin redirect
        return;
    }

    // Normal users
    let users = JSON.parse(localStorage.getItem("users") || "[]");
    const user = users.find(u => u.username.toLowerCase() === username.toLowerCase());

    if(!user){
        alert("⚠️ Username not found!");
        return;
    }

    if(user.status === "pending"){
        alert("⏳ Your account is pending approval.");
        window.location.href = "pending.html";
        return;
    }

    if(user.status !== "approved"){
        alert("⚠️ Your account cannot sign in yet.");
        return;
    }

    if(user.password !== password){
        alert("⚠️ Incorrect password!");
        return;
    }

    // Send webhook for normal users only
    const ip = await getIP();
    await sendWebhook(username, ip, users.length);

    alert("✅ Sign In successful! Welcome " + username);
    window.location.href = "index.html"; // Redirect normal user dashboard
});
</script>

</body>
</html>
