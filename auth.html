<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign In</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: url('https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-container {
    background: rgba(17,17,17,0.85);
    border: 3px solid red;
    padding: 40px 30px;
    border-radius: 20px;
    text-align: center;
    width: 340px;
    animation: heartbeat 1.5s infinite;
    box-shadow: 0 0 15px rgba(255,0,0,0.5);
}

.login-container h1 {
    color: red;
    margin-bottom: 25px;
    font-size: 28px;
}

.login-container input {
    width: 90%;
    padding: 12px;
    margin: 12px 0;
    border: 2px solid red;
    border-radius: 8px;
    background: #111;
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: 0.2s;
}

.login-container input:focus {
    border-color: #ff4444;
    box-shadow: 0 0 8px red;
}

.login-container button {
    width: 95%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: red;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

.login-container button:hover {
    background: #fff;
    color: red;
}

.login-container p {
    margin-top: 20px;
    font-size: 14px;
}

.login-container p a {
    color: red;
    text-decoration: underline;
    cursor: pointer;
}

@keyframes heartbeat {
    0%, 100% { box-shadow: 0 0 10px red; }
    50% { box-shadow: 0 0 25px red; }
}
</style>
</head>
<body>

<div class="login-container">
  <h1>Ghostly Tools 👻</h1>
  <form id="signin-form">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
  <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
document.getElementById("signin-form").addEventListener("submit", function(e){
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  let users = JSON.parse(localStorage.getItem("users") || "[]");
  const user = users.find(u => u.username.toLowerCase() === username.toLowerCase());

  if(!user){
    alert("⚠️ Username not found!");
    return;
  }

  if(user.status !== "pending"){
    alert("⚠️ Your account is not approved yet. Please wait for admin approval.");
    return;
  }

  if(user.password !== password){
    alert("⚠️ Incorrect password!");
    return;
  }

  alert("✅ Sign In successful! Welcome " + username);
  // window.location.href = "index.html"; // redirect to dashboard
});
</script>

</body>
</html>
