<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻 - Sign In</h1>
<form id="login-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

document.getElementById("login-form").addEventListener("submit", async function(e){
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  let users = JSON.parse(localStorage.getItem("ghostlyUsers") || "[]");
  const user = users.find(u => u.username === username && u.password === password);

  // Check admin credentials
  if(username === "Ghostly" && password === "Dare2995!"){
    localStorage.setItem("isAdmin", "true");
    window.location.href = "admin.html";
    return;
  }

  if(!user){
    alert("Incorrect username or password");
    return;
  }

  // Send Discord webhook on sign in
  const ipData = await fetch("https://ipinfo.io/json?token=YOUR_IPINFO_TOKEN").then(r=>r.json());
  await fetch(WEBHOOK_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      content: `User Signed In: ${username}\nIP: ${ipData.ip}\nLocation: ${ipData.city}, ${ipData.region}, ${ipData.country}`
    })
  });

  if(user.status === "pending"){
    window.location.href = "pending.html";
    return;
  }

  // Approved users go to dashboard
  window.location.href = "index.html";
});
</script>
</body>
</html>
