<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="auth-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<!-- Music Controls + Video -->
<div class="music-controls-container">
  <iframe id="ytPlayer" class="music-video" src="https://www.youtube.com/embed/a07qXFXjEDI?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=a07qXFXjEDI" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  <button onclick="playYT()">▶ Play</button>
  <button onclick="pauseYT()">⏸ Pause</button>
  <button onclick="rewindYT()">⏪ 10s</button>
  <button onclick="forwardYT()">⏩ 10s</button>
</div>

<script>
document.getElementById("auth-form").addEventListener("submit", function(e){
  e.preventDefault();
  const username=document.getElementById("username").value;
  const password=document.getElementById("password").value;
  let users=JSON.parse(localStorage.getItem("users")||"[]");
  const user=users.find(u=>u.username===username && u.password===password);
  if(!user){ alert("Invalid credentials"); return; }
  localStorage.setItem("signedInUser", username);
  if(user.status==="pending"){ window.location="pending.html"; }
  else{ window.location="index.html"; }
});

// YouTube Controls
let player;
function onYouTubeIframeAPIReady(){ player = new YT.Player('ytPlayer'); }
function playYT(){ if(player) player.playVideo(); }
function pauseYT(){ if(player) player.pauseVideo(); }
function rewindYT(){ if(player) player.seekTo(player.getCurrentTime()-10,true); }
function forwardYT(){ if(player) player.seekTo(player.getCurrentTime()+10,true); }
let tag=document.createElement('script'); tag.src="https://www.youtube.com/iframe_api"; document.body.appendChild(tag);
</script>
</body>
</html>
