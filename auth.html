<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-container">
    <h1>Ghostly Portal</h1>

    <!-- Sign In -->
    <div id="signin-form">
        <h2>Sign In</h2>
        <input type="text" id="signin-username" placeholder="Username" required>
        <input type="password" id="signin-password" placeholder="Password" required>
        <button id="signin-btn">Sign In</button>
        <p>Don't have an account? <span id="show-signup" class="link">Sign Up</span></p>
    </div>

    <!-- Sign Up -->
    <div id="signup-form" style="display:none;">
        <h2>Sign Up</h2>
        <input type="text" id="signup-username" placeholder="Username" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <button id="signup-btn">Sign Up</button>
        <p>Already have an account? <span id="show-signin" class="link">Sign In</span></p>
    </div>
</div>

<!-- Pop-up -->
<div id="popup" class="popup">
  <div class="popup-content">
    <p id="popup-message">Welcome to Ghostly Tools – The Ultimate Toolbox</p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<div id="ghost-container"></div>
<audio id="bg-music" src="Ghostly_music.mp3" loop muted></audio>

<script src="scripts.js"></script>
<script src="auth.js"></script>
<script>
const music = document.getElementById('bg-music');
music.play().then(()=>{ music.muted=false; music.volume=0.2; }).catch(e=>console.log(e));

// Show initial welcome pop-up
window.addEventListener('load', ()=>{
    showPopup("Welcome to Ghostly Tools – The Ultimate Toolbox");
});

// Toggle between Sign In / Sign Up forms
document.getElementById('show-signup').addEventListener('click', ()=>{
    document.getElementById('signin-form').style.display='none';
    document.getElementById('signup-form').style.display='block';
});
document.getElementById('show-signin').addEventListener('click', ()=>{
    document.getElementById('signup-form').style.display='none';
    document.getElementById('signin-form').style.display='block';
});

// Sign Up logic
document.getElementById('signup-btn').addEventListener('click', ()=>{
    const username = document.getElementById('signup-username').value.trim();
    const password = document.getElementById('signup-password').value.trim();
    if(!username || !password){
        showPopup("Please enter both fields.");
        return;
    }
    let users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');
    if(users[username]){
        showPopup("Username already exists.");
        return;
    }
    users[username] = {password: password, approved: false};
    localStorage.setItem('ghostlyUsers', JSON.stringify(users));
    showPopup("Account created! Waiting for admin approval.");
    document.getElementById('signup-form').style.display='none';
    document.getElementById('signin-form').style.display='block';
});

// Sign In logic with redirects
document.getElementById('signin-btn').addEventListener('click', ()=>{
    const username = document.getElementById('signin-username').value.trim();
    const password = document.getElementById('signin-password').value.trim();
    let users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');

    if(users[username] && users[username].password===password){
        sessionStorage.setItem('loggedInUser', username);

        if(username === "Ghostly"){
            // Admin goes to admin panel
            window.location.href='admin.html';
        } else if(!users[username].approved){
            // Non-approved users go to index page, downloads locked
            window.location.href='index.html';
        } else {
            // Approved users go to index page
            window.location.href='index.html';
        }
    } else {
        showPopup("Incorrect username or password.");
    }
});
</script>
</body>
</html>
