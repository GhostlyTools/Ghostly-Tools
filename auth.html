<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="content">
  <h1>Ghostly Tools 👻</h1>

  <div class="auth-form" id="signin-form">
    <h2>Sign In</h2>
    <input type="text" id="signin-username" placeholder="Username">
    <input type="password" id="signin-password" placeholder="Password">
    <button id="signin-btn">Sign In</button>
    <p>Don't have an account? <button id="show-signup">Sign Up</button></p>
  </div>

  <div class="auth-form" id="signup-form" style="display:none;">
    <h2>Sign Up</h2>
    <input type="text" id="signup-username" placeholder="Username">
    <input type="password" id="signup-password" placeholder="Password">
    <button id="signup-btn">Create Account</button>
    <p>Already have an account? <button id="show-signin">Sign In</button></p>
  </div>
</div>

<div id="popup" class="popup">
  <div class="popup-content">
    <p id="popup-message"></p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<audio id="bg-music" src="ghostly_music.mp3" loop></audio>
<script src="scripts.js"></script>
<script>
const webhookURL = "https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP";

document.getElementById('show-signup').addEventListener('click', ()=>{
    document.getElementById('signin-form').style.display='none';
    document.getElementById('signup-form').style.display='block';
});
document.getElementById('show-signin').addEventListener('click', ()=>{
    document.getElementById('signup-form').style.display='none';
    document.getElementById('signin-form').style.display='block';
});

document.getElementById('signin-btn').addEventListener('click', ()=>{
    const username = document.getElementById('signin-username').value.trim();
    const password = document.getElementById('signin-password').value;
    if(!username||!password){showPopup("Please enter both username and password."); return;}
    const users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');
    if(username==="Ghostly" && password==="Dare2995!"){
        sessionStorage.setItem('loggedInUser', username);
        window.location.href='admin.html';
        return;
    }
    if(users[username] && users[username].password===password){
        sessionStorage.setItem('loggedInUser', username);
        setTimeout(()=>window.location.href='index.html',50);
    } else showPopup("Incorrect username or password.");
});

document.getElementById('signup-btn').addEventListener('click', ()=>{
    const username = document.getElementById('signup-username').value.trim();
    const password = document.getElementById('signup-password').value;
    let users = JSON.parse(localStorage.getItem('ghostlyUsers')||'{}');
    if(!username||!password){showPopup("Please enter both username and password."); return;}
    if(users[username]){showPopup("Username already exists."); return;}
    users[username] = { password: password, approved: false };
    localStorage.setItem('ghostlyUsers', JSON.stringify(users));

    fetch(webhookURL, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({content:`New Ghostly user signup: **${username}**`})
    });

    showPopup("Sign-up successful! Waiting for admin approval.");
});
</script>
</body>
</html>
