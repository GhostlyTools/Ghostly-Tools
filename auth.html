<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="login-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<audio id="bg-music" src="Ghostly_music.mp3" loop autoplay></audio>

<script>
const music=document.getElementById("bg-music"); music.volume=1.0;
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e, ()=>music.play().catch(()=>{}), {once:true}));

document.getElementById("login-form").addEventListener("submit", function(e){
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const adminUser = { username: "Ghostly", password: "Dare2995!" };

  if(username === adminUser.username && password === adminUser.password){
    sessionStorage.setItem("loggedInUser", username);
    sessionStorage.setItem("isAdmin", "true");
    window.location.href = "admin.html"; return;
  }

  const users = JSON.parse(localStorage.getItem("ghostlyUsers")||"{}");
  if(!users[username]){ alert("Username does not exist!"); return; }
  if(users[username].password !== password){ alert("Incorrect password!"); return; }

  users[username].ip = users[username].ip || "Unknown";
  localStorage.setItem("ghostlyUsers", JSON.stringify(users));
  sessionStorage.setItem("loggedInUser", username);
  sessionStorage.setItem("isAdmin", "false");

  if(users[username].approved) window.location.href = "index.html";
  else window.location.href = "index.html?pending=true";
});
</script>
</body>
</html>
