<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Change all text to scary font */
body, h1, h2, h3, h4, h5, h6, p, a, button, input, span, li {
  font-family: 'Nosifer', cursive !important; /* scary blood-drip font */
  color: red !important;
  text-shadow: 
    0 0 5px #ff0000,
    0 0 10px #ff0000,
    0 0 20px #ff0000,
    0 0 30px #ff0000,
    0 0 40px #ff0000;
}

/* Floating page text */
.floating-page-list li {
  position: absolute;
  font-size: 2em;
  color: red;
  text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 20px #ff0000;
}

/* Inputs placeholder style */
input::placeholder {
  color: red;
  text-shadow:
    0 0 3px #ff0000,
    0 0 5px #ff0000;
}

/* Buttons */
button {
  color: white; 
  text-shadow:
    0 0 5px #ff0000,
    0 0 10px #ff0000;
}

/* Links hover effect */
a:hover {
  text-shadow:
    0 0 10px #ff0000,
    0 0 20px #ff0000;
}
</style>
</head>
<body>

<ul class="floating-page-list">
  <li>Sigh In</li>
</ul>

<div class="login-container">
  <h1>Ghostly Tools 👻</h1>
  <form id="signin-form">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
  <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
// Floating animation script (same as before)
const floatingItems = document.querySelectorAll(".floating-page-list li");
floatingItems.forEach(item => {
  let posX = Math.random() * (window.innerWidth - 100);
  let posY = Math.random() * (window.innerHeight - 50);
  item.style.left = posX + "px";
  item.style.top = posY + "px";

  function move() {
    posX += (Math.random() - 0.5) * 2;
    posY += (Math.random() - 0.5) * 2;
    posX = Math.max(0, Math.min(window.innerWidth - 100, posX));
    posY = Math.max(0, Math.min(window.innerHeight - 50, posY));
    item.style.left = posX + "px";
    item.style.top = posY + "px";
    requestAnimationFrame(move);
  }
  move();
});
</script>

</body>
</html>
