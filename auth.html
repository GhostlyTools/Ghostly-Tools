<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="login-form">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<audio id="bg-music" src="Ghostly_music.mp3" loop></audio>

<script>
const music=document.getElementById("bg-music");
music.volume=1.0;
function playMusic(){music.play().catch(()=>{});}
playMusic();
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e, playMusic, {once:true}));

const loginForm=document.getElementById("login-form");
loginForm.addEventListener("submit",function(e){
  e.preventDefault();
  const username=document.getElementById("username").value;
  const password=document.getElementById("password").value;
  const adminUser={username:"Ghostly",password:"Dare2995!"};

  if(username===adminUser.username && password===adminUser.password){
    sessionStorage.setItem("loggedInUser",username);
    sessionStorage.setItem("isAdmin","true");
    alert("👻 Welcome Admin!");
    window.location.href="admin.html";
    return;
  }

  fetch('https://api.ipify.org?format=json')
    .then(res=>res.json())
    .then(data=>{
      const ip=data.ip;
      const users=JSON.parse(localStorage.getItem("ghostlyUsers")||"{}");
      if(!users[username]) return alert("Username does not exist!");
      if(users[username].password!==password) return alert("Incorrect password!");
      users[username].ip=ip;
      localStorage.setItem("ghostlyUsers",JSON.stringify(users));
      sessionStorage.setItem("loggedInUser",username);
      sessionStorage.setItem("isAdmin","false");
      if(users[username].approved){
          window.location.href="index.html";
      } else {
          window.location.href="index.html?pending=true";
      }
    })
    .catch(err=>alert("IP fetch error: "+err));
});
</script>
</body>
</html>
