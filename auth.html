<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  margin:0; padding:0;
  font-family:"Creepster", cursive;
  color:#fff;
  background:url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed;
  background-size:cover;
  display:flex; justify-content:center; align-items:center; height:100vh;
}
.login-container {
  background: rgba(0,0,0,0.8);
  padding:30px;
  border-radius:15px;
  box-shadow:0 0 25px red;
  text-align:center;
  width:300px;
}
.login-container h1 {
  text-shadow:0 0 15px red;
  margin-bottom:20px;
}
.login-container input {
  width:100%;
  padding:10px;
  margin:10px 0;
  border:none;
  border-radius:5px;
}
.login-container button {
  width:100%;
  padding:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:5px;
  cursor:pointer;
}
.login-container button:hover {
  background:#ff0000cc;
}
.login-container p {
  margin-top:10px;
  font-size:0.9em;
}
.login-container a {
  color:red;
  text-decoration:none;
}
.login-container a:hover {
  text-decoration:underline;
}
</style>
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signin-form">
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
document.getElementById("signin-form").addEventListener("submit", function(e){
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  // Admin credentials
  const adminUser = "admin";
  const adminPass = "Dare2995!";

  if(username === adminUser && password === adminPass){
      localStorage.setItem("signedInUser", username);
      window.location.href = "admin.html";
      return;
  }

  // Check normal users in localStorage
  let users = JSON.parse(localStorage.getItem("users")||"[]");
  const currentUser = users.find(u=>u.username===username && u.password===password);

  if(!currentUser){
      alert("Invalid username or password.");
      return;
  }

  if(currentUser.status !== "approved"){
      localStorage.setItem("signedInUser", username);
      window.location.href = "pending.html";
      return;
  }

  localStorage.setItem("signedInUser", username);
  window.location.href = "index.html";
});
</script>
</body>
</html>
