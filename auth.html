<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    margin: 0; padding: 0; height: 100vh;
    display: flex; justify-content: center; align-items: center; flex-direction: column;
    font-family: "Creepster", cursive, sans-serif;
    color: #fff;
    background: url("https://wallpapers.com/images/hd/cool-3d-ghost-crawling-in-dark-agupg3ry9e4innyi.jpg") no-repeat center center fixed;
    background-size: cover;
  }
  .login-container {
    background: rgba(0,0,0,0.7);
    padding: 30px; border-radius: 10px; box-shadow: 0 0 20px red; text-align: center;
    animation: flicker 2s infinite;
  }
  h1 { margin-bottom: 20px; text-shadow: 0 0 10px red, 0 0 20px black; }
  input { display: block; width: 100%; margin: 10px 0; padding: 10px; border: none; border-radius: 5px; }
  button { background: red; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
  button:hover { background: darkred; }
  a { color: #f55; text-decoration: none; } a:hover { text-decoration: underline; }
  @keyframes flicker { 0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { box-shadow: 0 0 20px red; } 20%, 24%, 55% { box-shadow: none; } }
  #jumpscare { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: black url("https://i.imgur.com/zY8hVY2.png") center center no-repeat; background-size: cover; z-index:9999; }
</style>
</head>
<body>

<div id="jumpscare"></div>

<div class="login-container">
  <h1>Ghostly Tools 👻</h1>
  <form id="login-form">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
  <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<audio id="bg-music" src="Ghostly_music.mp3" loop></audio>

<script>
const loginForm = document.getElementById("login-form");
const music = document.getElementById("bg-music");

loginForm.addEventListener("submit", function(e){
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const approved = JSON.parse(localStorage.getItem("approvedUsers") || "[]");

  const user = approved.find(u => u.username === username && u.password === password);
  if(!user) return alert("Incorrect username or password!");

  sessionStorage.setItem("loggedInUser", username);

  // Admin login (no webhook)
  if(username === "Ghostly" && password === "Dare2995!") {
    window.location.href = "admin.html";
    return;
  }

  // Regular user → send webhook
  fetch("https://api.ipify.org?format=json")
    .then(res=>res.json())
    .then(data=>{
      fetch("https://discord.com/api/webhooks/1405861054017179708/rYLQuKpFZCXOHT1nPhBPvq4hDeWiyohO46jMVjL6bWVSATni6QLX1umoxDeAoUQwBTXP", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({content:`👻 **Dashboard Login**\nUser: ${username}\nIP: ${data.ip}`})
      })
    });

  window.location.href = "dashboard.html";
});

// Click-to-play music with welcome
document.addEventListener("click", ()=>{
  if(music.paused){
    music.volume = 1.0;
    music.play();
    alert("👻 Welcome to Ghostly Tools — the alternate toolbox!");
  }
},{once:true});

// Random jumpscare
setTimeout(()=>{
  if(Math.random()<0.5){
    document.getElementById("jumpscare").style.display="block";
    setTimeout(()=>{document.getElementById("jumpscare").style.display="none";},2000);
  }
},5000);
</script>
</body>
</html>
