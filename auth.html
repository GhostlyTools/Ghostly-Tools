<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghostly Tools 👻 - Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>Ghostly Tools 👻</h1>
<form id="signin-form">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
document.getElementById("signin-form").addEventListener("submit", function(e){
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    // Admin credentials
    const adminUser = "admin";
    const adminPass = "Dare2995!";

    if(username === adminUser && password === adminPass){
        // Redirect to admin panel
        localStorage.setItem("signedInUser", username);
        window.location.href = "admin.html";
        return;
    }

    // Check normal users in localStorage
    let users = JSON.parse(localStorage.getItem("users")||"[]");
    const currentUser = users.find(u=>u.username===username && u.password===password);

    if(!currentUser){
        alert("Invalid username or password.");
        return;
    }

    if(currentUser.status !== "approved"){
        // Redirect to pending page
        localStorage.setItem("signedInUser", username);
        window.location.href = "pending.html";
        return;
    }

    // Redirect to main page
    localStorage.setItem("signedInUser", username);
    window.location.href = "index.html";
});
</script>
</body>
</html>
